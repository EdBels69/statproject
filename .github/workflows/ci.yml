name: StatAnalyzer CI Insurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Frontend Quality Gate
  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install Dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Unit Tests
      run: npm run test:run
    - name: Build
      run: npm run build

  # 2. Backend Full Test Gate
  backend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx pytest-timeout
    - name: Run Full Backend Tests
      run: pytest -q tests

  # 3. Runtime Warning Gate (Critical statistical paths)
  runtime-warning-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx pytest-timeout
    - name: RuntimeWarning gate for critical suite
      run: |
        bash scripts/run_runtime_warning_gate.sh

  # 4. Model-router benchmark contract gate
  benchmark-contract-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx pytest-timeout
    - name: Benchmark contract tests
      run: |
        python -m pytest -q \
          tests/test_api_v2.py::test_model_router_benchmark_snapshot_endpoint \
          tests/test_model_router_benchmark.py::test_benchmark_cli_generates_json_and_markdown \
          tests/test_model_router_benchmark.py::test_benchmark_cli_strict_min_runs_fails_when_insufficient
